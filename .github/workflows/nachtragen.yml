name: Alte Reels als Shorts nachtragen

# Auf Instagram liegen fertige Reels, die dort niemand gesehen hat, weil dem
# Konto das Publikum fehlt. YouTube spielt auch neue Kanaele an Fremde aus -
# dieselben Videos bekommen dort eine Chance.
#
# Warum taeglich statt alles auf einmal: Ein Upload kostet 1.600 von 10.000
# Einheiten Tagesbudget. Mit dem taeglichen Reel bleiben fuenf Nachtraege.
# Der Job laeuft, bis der Rueckstand weg ist, und tut danach nichts mehr.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      anzahl:
        description: "Wie viele nachtragen (Kontingent erlaubt 5)"
        default: "5"

permissions:
  contents: write

concurrency:
  group: nachtragen
  cancel-in-progress: false

jobs:
  nachtragen:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci --omit=optional

      - name: Nachtragen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
        run: node scripts/nachtragen.js "${{ inputs.anzahl || 5 }}"

      - name: Historie zurueckschreiben
        if: success()
        run: |
          if git diff --quiet -- data/history.json; then
            echo "Nichts nachgetragen."
            exit 0
          fi
          git config user.name "geld-pinguin-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history.json
          git commit -m "Nachtrag: Reels als Shorts hochgeladen [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
