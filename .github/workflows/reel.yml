name: Reel erzeugen und veroeffentlichen

on:
  schedule:
    # Halbstuendlich im aktiven Fenster - NICHT weil so oft gepostet wird,
    # sondern weil GitHub geplante Laeufe mit der niedrigsten Prioritaet
    # ausfuehrt. Gemessen wurden 2-4 Stunden Verspaetung und ausgefallene
    # Laeufe. Der Job prueft jedes Mal, ob ein Slot faellig ist, und postet
    # nur dann. So trifft der Kanal seine Zeiten trotzdem.
    - cron: "*/30 5-21 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Wirklich auf Instagram veroeffentlichen?"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: reel
  cancel-in-progress: false

jobs:
  # Guenstige Vorpruefung: laeuft in Sekunden und bricht die meisten Male hier ab.
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      posten: ${{ steps.gate.outputs.posten }}
    steps:
      - uses: actions/checkout@v4

      - name: Ist ein Slot faellig?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "posten=ja" >> "$GITHUB_OUTPUT"
            echo "Handstart - Faelligkeitspruefung uebersprungen."
          else
            ergebnis=$(node scripts/faellig.js)
            echo "posten=$ergebnis" >> "$GITHUB_OUTPUT"
          fi

  reel:
    needs: pruefen
    if: needs.pruefen.outputs.posten == 'ja'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg und Schriften installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          mkdir -p assets/fonts
          curl -fsSL --retry 2 -o assets/fonts/Anton-Regular.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf \
            || echo "Anton konnte nicht geladen werden - es wird DejaVu Sans verwendet."

      - name: Abhaengigkeiten
        run: |
          npm ci --omit=optional
          pip install --quiet -r requirements.txt

      - name: Reel bauen und posten
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Zweitverwertung als YouTube Short. Fehlen die drei, wird der
          # Schritt uebersprungen - der Instagram-Beitrag laeuft normal.
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Sicherung gegen den falschen Kanal: Stimmt die ID nicht,
          # bricht der Upload ab, bevor etwas hochgeladen wird.
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: |
          if [ "${{ inputs.publish }}" = "false" ]; then
            node src/index.js --no-publish
          else
            node src/index.js
          fi

      - name: Video als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: |
            build/reel.mp4
            build/script.json
            build/subs.ass
          retention-days: 7
          if-no-files-found: ignore

      - name: Historie zurueckschreiben
        if: success()
        run: |
          if git diff --quiet -- data/history.json; then
            echo "Keine Aenderung an der Historie."
            exit 0
          fi
          git config user.name "geld-pinguin-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history.json
          git commit -m "Historie: neues Reel [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push-Versuch $i fehlgeschlagen, neuer Versuch ..."
            sleep 5
          done
          echo "Historie konnte nicht gepusht werden."
          exit 1
