name: Motorrad Kompass - Sichtbarkeit ändern

# Schaltet ein hochgeladenes Video auf public, unlisted oder private und
# meldet, was YouTube danach wirklich anzeigt.
on:
  workflow_dispatch:
    inputs:
      video:
        description: "YouTube-Video-ID"
        type: string
        required: true
      sichtbarkeit:
        type: choice
        options: [public, unlisted, private]
        default: public

permissions:
  contents: write

jobs:
  sichtbarkeit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Sichtbarkeit setzen
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID_MOTORRAD }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET_MOTORRAD }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_MOTORRAD }}
          KANAL: ${{ secrets.YT_CHANNEL_ID_MOTORRAD }}
          VIDEO: ${{ inputs.video }}
          ZIEL: ${{ inputs.sichtbarkeit }}
        run: |
          set -euo pipefail
          token=$(curl -sS https://oauth2.googleapis.com/token \
            -d client_id="$YT_CLIENT_ID" -d client_secret="$YT_CLIENT_SECRET" \
            -d refresh_token="$YT_REFRESH_TOKEN" -d grant_type=refresh_token | jq -r '.access_token // empty')
          [ -n "$token" ] || { echo "Google-Token abgelehnt (Zugang abgelaufen?)."; exit 1; }
          echo "::add-mask::$token"

          # Nur Videos des eigenen Kanals anfassen.
          vorher=$(curl -sS -H "Authorization: Bearer $token" \
            "https://www.googleapis.com/youtube/v3/videos?part=snippet,status&id=$VIDEO")
          [ "$(echo "$vorher" | jq -r '.items[0].snippet.channelId // empty')" = "$KANAL" ] \
            || { echo "Video $VIDEO gehört nicht zum Kanal. Nichts geändert."; exit 1; }

          antwort=$(curl -sS -X PUT -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            "https://www.googleapis.com/youtube/v3/videos?part=status" \
            -d "$(jq -n --arg id "$VIDEO" --arg s "$ZIEL" '{id:$id,status:{privacyStatus:$s,selfDeclaredMadeForKids:false,embeddable:true}}')")
          echo "$antwort" | jq -e '.status' >/dev/null || { echo "Änderung abgelehnt: $(echo "$antwort" | jq -r '.error.message // "unbekannt"')"; exit 1; }

          sleep 5
          ist=$(curl -sS -H "Authorization: Bearer $token" \
            "https://www.googleapis.com/youtube/v3/videos?part=status&id=$VIDEO" | jq -r '.items[0].status.privacyStatus')
          echo "Sichtbarkeit laut YouTube: $ist (gewünscht: $ZIEL)"
          echo "IST=$ist" >> "$GITHUB_ENV"
          [ "$ist" = "$ZIEL" ]

      - name: Historie nachführen
        run: |
          set -euo pipefail
          datei=data/motorrad-historie.json
          jq --arg id "${{ inputs.video }}" --arg s "$IST" 'map(if .youtubeId == $id then .sichtbarkeit = $s else . end)' "$datei" > "$datei.neu" && mv "$datei.neu" "$datei"
          git diff --quiet -- "$datei" && exit 0
          git config user.name "motorrad-kompass-bot"
          git config user.email "bot@users.noreply.github.com"
          git add "$datei"
          git commit -m "Motorrad Kompass: Sichtbarkeit geändert [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push
